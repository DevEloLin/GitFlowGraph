name: CD

# Triggered when GitFlowGraph-core's release workflow publishes a new release
# (beta or stable) to this repository via GH_PUBLIC_REPO_TOKEN.
on:
  release:
    types: [published, prereleased]

permissions:
  contents: write

jobs:
  sync-version:
    name: Sync RUNTIME_VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Extract version from release tag
        id: version
        run: |
          TAG=${{ github.ref_name }}
          # Strip leading "v": v0.1.0-beta.1 → 0.1.0-beta.1
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update RUNTIME_VERSION in src/lib.rs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python3 - <<EOF
          import re
          path = 'src/lib.rs'
          with open(path) as f:
              content = f.read()
          content = re.sub(
              r'const RUNTIME_VERSION: &str = "[^"]*";',
              f'const RUNTIME_VERSION: &str = "{VERSION}";',
              content
          )
          with open(path, 'w') as f:
              f.write(content)
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib.rs
          if git diff --staged --quiet; then
            echo "RUNTIME_VERSION already up to date, skipping commit."
          else
            git commit -m "chore: sync runtime version to ${{ github.ref_name }}"
            git push origin main
          fi
